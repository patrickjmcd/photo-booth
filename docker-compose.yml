version: "3"

services:
    camera:
        build: ./camera
        image: photobooth-camera
        container_name: photobooth-camera
        ports:
            - 8000:8000
        devices:
            - "/dev/video0:/dev/video0"
        volumes:
            - /run/cups/cups.sock:/run/cups/cups.sock
        environment:
            - PRINTER_NAME=MITSUBISHI_CP9550DW_S

    app:
        image: photobooth-app
        build:
            context: ./app
            # dockerfile: Dockerfile.prod
        env_file:
            - .env
        ports:
            - 1337:80
            - 3000:3000

    caddy:
        build: ./caddy
        image: photobooth-caddy
        container_name: photobooth-caddy
        depends_on:
            - app
            - camera
        ports:
            - 443:443
        env_file:
            - .env
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - /etc/tailscale-certs:/certs:ro
            - caddy_data:/data

volumes:
    photos:
    caddy_data:
