version: "3"

services:
    camera:
        build: ./camera
        image: photobooth-camera
        container_name: photobooth-camera
        ports:
            - 8000:8000
        devices:
            - "/dev/video0:/dev/video0"
        volumes:
            - /run/cups/cups.sock:/run/cups/cups.sock
        environment:
            - PRINTER_NAME=MITSUBISHI_CP9550DW_S

    app:
        image: photobooth-app
        build:
            context: ./app
            # dockerfile: Dockerfile.prod
        environment:
            - VITE_API_URL=http://localhost:8000
            - VITE_WS_URL=ws://localhost:8000
        ports:
            - 1337:80
            - 3000:3000

volumes:
    photos:
